const EPS = 1e-9;
function need(p, reason) { if (!p) throw new Error(reason); }
function finite(n, name, min = -Infinity) {
  need(typeof n === 'number' && Number.isFinite(n) && n >= min, `Invalid ${name}`);
  return n;
}
function id(v, label) { need(typeof v === 'string' && v.trim().length > 0, `Missing ${label}`); return v.trim(); }
function instant(v, label) {
  need(typeof v === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(v), `Invalid ISO timestamp ${label}`);

}
const average = arr => arr.reduce((s,x)=>s+x,0)/arr.length;
const fixed = (v, digits=6) => Number(v.toFixed(digits));

/** Rows have strict temporal provenance. Actual observations may become available only after targetAt. */
function verifyForecastBacktest(rows, {asOf, expectedUnit='m3/s'} = {}) {
  need(Array.isArray(rows) && rows.length >= 2, 'At least two forecast records required');
  const cutoff = instant(asOf, 'asOf');
  const errors = [], absolute = [], actuals = [], issues = new Set();
  for (let i=0;i<rows.length;i++) {
    const r = rows[i];
    need(r && typeof r === 'object', `Invalid row ${i}`);
    id(r.forecastId, `forecastId ${i}`);
    need(!issues.has(r.forecastId), `Duplicate forecastId ${r.forecastId}`); issues.add(r.forecastId);
    need(r.unit === expectedUnit, `Wrong unit in row ${i}`);
    const issue = instant(r.issuedAt,'issuedAt');
    const target = instant(r.targetAt,'targetAt');
    const features = instant(r.featuresAvailableAt,'featuresAvailableAt');
    const observed = instant(r.observedAvailableAt,'observedAvailableAt');
    need(features <= issue, `FORECAST_LEAKAGE: future features in ${r.forecastId}`);
    need(issue < target, `Forecast must precede target in ${r.forecastId}`);
    need(observed >= target, `Observation timestamp precedes target in ${r.forecastId}`);
    need(observed <= cutoff, `Observation not yet available in ${r.forecastId}`);
    const y = finite(r.actual,`actual ${i}`,0);
    const p = finite(r.predicted,`predicted ${i}`,0);
    errors.push(p-y); absolute.push(Math.abs(p-y)); actuals.push(y);
  }
  const sq=errors.map(e=>e*e);const denom=actuals.reduce((a,b)=>a+b,0);
  return {
    count: rows.length, unit:expectedUnit, asOf,
    mae:fixed(average(absolute)), rmse:fixed(Math.sqrt(average(sq))),
    bias:fixed(average(errors)), wapePct: denom>EPS?fixed(100*absolute.reduce((a,b)=>a+b,0)/denom):null,
    wapeStatus:denom>EPS?'valid':'undefined_zero_actual',
    leakageCheck:'PASS', industrialValidation:false
  };
}

/** Structural data quality with explicit missing-vs-zero distinction, source and tenancy. */
function validateMeasurementBatch(batch, {orgId, assetId, metricUnits, asOf, minQuality='review'} = {}) {
  need(Array.isArray(batch) && batch.length > 0,'Empty measurement batch');
  need(['review','validated'].includes(minQuality),'Unknown minQuality policy');
  id(orgId,'orgId');id(assetId,'assetId');need(metricUnits && typeof metricUnits==='object','No metric unit dictionary');
  const cutoff=instant(asOf,'asOf'), keys=new Set(), errors=[];
  const seen=[];
  for(const r of batch){
    if(!r || typeof r !== 'object'){errors.push({key:'UNKNOWN',problems:['RECORD_INVALID']});continue;}
    const faults=[];
    if(r.orgId!==orgId || r.assetId!==assetId)faults.push('TENANT_ASSET_SCOPE');
    if(!r.sourceId || typeof r.sourceId!=='string')faults.push('SOURCE_MISSING');
    if(!Object.prototype.hasOwnProperty.call(metricUnits,r.metricId))faults.push('METRIC_UNKNOWN');
    else if(metricUnits[r.metricId]!==r.unit)faults.push('UNIT_MISMATCH');
    const stamp = typeof r.observedAt==='string'?Date.parse(r.observedAt):NaN;
    if(!Number.isFinite(stamp))faults.push('TIME_INVALID');
    else if(stamp>cutoff)faults.push('FUTURE_OBSERVATION');
    if(!Object.prototype.hasOwnProperty.call(r,'value') || r.value===null)faults.push('MISSING_NOT_ZERO');
    else if(typeof r.value!=='number'||!Number.isFinite(r.value))faults.push('NOT_FINITE');
    if(!['validated','review','rejected'].includes(r.quality))faults.push('QUALITY_UNKNOWN');
    if(r.quality==='rejected')faults.push('QUALITY_REJECTED');
    if(r.quality==='review' && minQuality==='validated')faults.push('QUALITY_BELOW_POLICY');
    const key=[r.orgId,r.assetId,r.sourceId,r.metricId,r.observedAt].join('|');
    if(keys.has(key))faults.push('DUPLICATE');keys.add(key);
    seen.push(key);
    if(faults.length)errors.push({key,problems:faults});
  }
  return {total:batch.length,accepted:batch.length-errors.length,rejected:errors.length,errors,valid:errors.length===0,unitDictionary:metricUnits,qualityPolicy:minQuality};
}

const CONTEXT_FIELDS=['orgId','assetId','baselineSnapshotId','constraintSetId','modelVersion','valuationDate','currency','discountRate'];
function compareBase(a,b){

}
function scenarioNpv(s){

    }

/** Portfolio gate: hard obligations, dependencies, resource caps, alternatives. */
function checkPortfolio({projects, selectedIds, annualCapsMln}) {
  need(Array.isArray(projects)&&Array.isArray(selectedIds),'Projects and selection required');
  need(annualCapsMln&&typeof annualCapsMln==='object','Annual budget caps missing');
  const byId=new Map();for(const p of projects){id(p.id,'project.id');need(!byId.has(p.id),'Duplicate project');byId.set(p.id,p);}
  const sel=new Set(selectedIds);need(sel.size===selectedIds.length,'Duplicate selection');
  const errors=[];const spends={};
  for(const p of projects){if(p.mandatory&&!sel.has(p.id))errors.push({code:'MANDATORY_MISSING',project:p.id});}
  for(const idv of sel){
    const p=byId.get(idv);if(!p){errors.push({code:'PROJECT_UNKNOWN',project:idv});continue;}
    for(const d of p.dependencies||[]){
      if(!byId.has(d))errors.push({code:'DEPENDENCY_UNKNOWN',project:p.id,dependency:d});
      if(!sel.has(d))errors.push({code:'DEPENDENCY_MISSING',project:p.id,dependency:d});
    }
    for(const x of p.exclusions||[])if(sel.has(x))errors.push({code:'MUTUAL_EXCLUSION',project:p.id,with:x});
    for(const [year,cost] of Object.entries(p.cashOutByYearMln||{})){finite(cost,`cost ${p.id} ${year}`,0);spends[year]=(spends[year]||0)+cost;}
  }
  const colors=new Map();
  function visit(pid,path=[]){
    if(colors.get(pid)===2)return;
    if(colors.get(pid)===1){errors.push({code:'DEPENDENCY_CYCLE',path:[...path,pid]});return;}
    const node=byId.get(pid);if(!node)return;colors.set(pid,1);
    for(const child of node.dependencies||[])if(sel.has(child))visit(child,[...path,pid]);
    colors.set(pid,2);
  }
  for(const pid of sel)visit(pid);
  for(const [year,amount] of Object.entries(spends)){
    if(!Object.prototype.hasOwnProperty.call(annualCapsMln,year))errors.push({code:'BUDGET_YEAR_UNDEFINED',year});
    else {finite(annualCapsMln[year],`budget ${year}`,0);if(amount>annualCapsMln[year]+EPS)errors.push({code:'BUDGET_LIMIT',year,amountMln:fixed(amount),limitMln:annualCapsMln[year]});}
  }
  return {valid:errors.length===0,errors,annualSpendMln:Object.fromEntries(Object.entries(spends).map(([k,v])=>[k,fixed(v)])),countSelected:sel.size,industrialValidation:false};
}

/** Reconcile financial benefit by real owner and impact key. No cross-organization merger. */
function reconcileBenefitsScoped(rows){
  need(Array.isArray(rows),'Array of benefits required');
  const groups=new Map(),flags=[];let sum=0;
  for(const r of rows){
    id(r.orgId,'organization');id(r.benefitKey,'benefitKey');id(r.evidenceRef,'evidenceRef');
    const amount=finite(r.annualBenefitMln,'annualBenefitMln',0);
    if(!['approved','in_execution','verification_pending','verified'].includes(r.status))continue;

function moduleView(id){const m=MODULES.find(m=>m.id===id),ex=moduleExamples[id];const permitted=ASSETS.filter(a=>a.orgId===orgId&&a.modules.includes(id));const formfields=ex.fields.map(([id,label,val,type])=>`<label>${safe(label)}<input name="${id}" type="${type||'number'}" step="any" value="${safe(val)}" required /></label>`).join('');return `<div class="module-banner" style="--accent:${m.color}"><div class="module-logo">${m.icon}</div><div><p class="eyebrow">ИНЖЕНЕРНО-ЭКОНОМИЧЕСКАЯ ЛАБОРАТОРИЯ</p><h2>${m.name}</h2><p>${m.kind} · Магаданская область</p></div><span class="lab-label">УЧЕБНЫЕ ДАННЫЕ</span></div><div class="content-grid"><div class="surface"><div class="surface-head"><h3>${safe(ex.title)}</h3><span>Локальный расчёт</span></div><p class="explainer">${safe(ex.desc)}</p><form id="calculator" class="calculator-grid">${formfields}<button type="submit" class="primary wide">Рассчитать сценарий</button></form><div id="calc-result" class="calc-result" aria-live="polite">Показатели появятся после расчёта.</div></div><div class="surface"><div class="surface-head"><h3>Региональный контекст</h3></div><div class="assets"><p>Доступные учебные объекты текущей организации</p>${permitted.map(a=>`<div class="asset-chip"><span class="asset-pin">⌖</span><span>${safe(a.label)}</span><small>${a.isRealName?'Реальное название · данные синтетические':'Вымышленный объект'}</small></div>`).join('')||'<p>Нет объектов в выбранном периметре — переключите организацию.</p>'}</div><button id="to-decision" class="secondary">Создать карточку инвестиционного решения →</button><div class="form-note">Расчёт не создаёт подтверждённого экономического эффекта. Решение требует источника, инженерного заключения, финансовой проверки и независимой приёмки.</div></div></div>`;}
function renderResult(id,form){const v=Object.fromEntries([...new FormData(form).entries()].map(([k,v])=>[k,v]));const n=k=>Number(v[k]);let entries=[];
  switch(id){
    case 'hydro':{const x=forecastMAE(v.prediction.split(',').map(Number),v.observed.split(',').map(Number));entries=[['MAE',`${fmt(x.mae)} м³/с`],['Проверенных пар',x.samples],['Ограничение',x.warning]];break;}
    case 'cascade':{const x=hydroBalance({storageM3:n('storage'),inflowM3s:n('qin'),outflowM3s:n('qout'),seconds:3600,minStorageM3:0,maxStorageM3:2_000_000});const p=hydropower({flowM3s:n('qout'),headM:n('head'),efficiency:n('eff'),ratedMw:n('rated')});entries=[['Ожидаемый запас',fmt(x.storageEndM3)+' м³'],['Условная мощность',fmt(p.calculatedMw)+' МВт'],['Проверка границ',x.valid?'В пределах условных границ':x.reason],['Примечание',p.warning]];break;}
    case 'turbine':{const x=conditionAnomaly({value:n('value'),referenceMean:n('mean'),referenceSd:n('sd'),comparableRegime:n('comparable')===1});entries=[['Состояние',x.message],['Z-score',x.zScore??'Не определяется'],['Вероятность отказа','Не вычислялась']];break;}
    case 'grid':{const x=gridEnergyBalance({inputMwh:n('input'),outputMwh:n('output'),ownUseMwh:n('own'),calculatedTechnicalLossMwh:n('technical')});entries=[['Измеренный остаток',fmt(x.measuredLossMwh)+' МВт·ч'],['Условная доля',fmt(x.lossPct)+'%'],['Необъяснённый остаток',fmt(x.unexplainedMwh)+' МВт·ч'],['Оценка',x.status]];break;}
    case 'heat':{const x=heatDuty({massKgSec:n('mass'),temperatureSupplyC:n('supply'),temperatureReturnC:n('return')});entries=[['Тепловая мощность',fmt(x.dutyMw)+' МВт'],['Ограничение',x.warning]];break;}
    case 'capex':{const x=npv({capexMln:n('capex'),annualBenefitMln:n('gross'),annualOpexMln:n('opex'),discountRate:n('rate'),years:n('years')});entries=[['NPV',fmt(x.valueMln)+' млн ₽'],['Годовой поток',fmt(x.annualNetMln)+' млн ₽'],['Аннуитетный коэффициент',fmt(x.factor,4)]];break;}
  }
  $('#calc-result').innerHTML=`<div class="result-grid">${entries.map(([a,b])=>`<div><small>${safe(a)}</small><strong>${safe(b)}</strong></div>`).join('')}</div><small class="result-stamp">Результат учебного вычисления · не промышленный расчёт</small>`;
}
function decisionCreate(){let permitted=ASSETS.filter(a=>a.orgId===orgId);let moduleForAsset=permitted.length?moduleOptions(permitted[0].id):[];
  return `<div class="surface"><div class="surface-head"><h3>Новая инициатива</h3><span>Только аналитик</span></div><form id="new-decision" class="decision-create"><label>Объект<select name="assetId" id="asset-select">${permitted.map(a=>`<option value="${a.id}">${safe(a.label)}</option>`).join('')}</select></label><label>Исходный модуль<select name="moduleId" id="module-select">${moduleForAsset.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></label><label class="double">Название мероприятия<input name="title" required value="Демо: вариант модернизации для проверки" maxlength="160"></label><label>Код экономического эффекта<input name="benefitKey" required value="MAG-TEST-01" maxlength="60"></label><label>Источник основания<input name="evidenceRef" required value="synthetic/data-v0.2" maxlength="120"></label><label>CAPEX, млн ₽<input type="number" name="capexMln" value="28" min="0" step="any" required></label><label>Годовой валовый эффект, млн ₽<input type="number" name="annualBenefitMln" value="10.7" min="0" step="any" required></label><label>Дополнительный OPEX, млн ₽<input type="number" name="annualOpexMln" value="1.5" min="0" step="any" required></label><label>Ставка дисконтирования (доля)<input type="number" name="discountRate" value="0.12" min="0" max="1" step="any" required></label><label>Горизонт, лет<input type="number" name="years" value="8" min="1" max="50" step="1" required></label><button type="submit" class="primary double" ${role!=='analyst'?'disabled title="Включите роль Аналитик"':''}>Создать инициативу с проверкой входных данных</button></form><div class="form-note">В демоверсии роль выбирается вручную; это не производственная аутентификация. Данные сохраняются только в браузере.</div></div>`;
}
function decisionItem(x){const asset=ASSETS.find(a=>a.id===x.assetId);const available=availableActions(x,actor());const status=x.status==='verified'?'good':x.status==='rejected'?'bad':'';
  return `<article class="decision-card"><div class="decision-top"><div><small>${safe(x.id)} · ${safe(asset?.label)} · ${safe(MODULES.find(m=>m.id===x.moduleId)?.name)}</small><h3>${safe(x.title)}</h3></div><span class="status ${status}">${safe(STATUS_LABEL[x.status]||x.status)}</span></div><div class="decision-metrics">${metric('CAPEX',fmt(x.capexMln)+' млн ₽','Расчётный')}${metric('NPV',fmt(x.npvMln)+' млн ₽','Упрощённая модель')}${metric('Эффект в год',fmt(x.annualBenefitMln)+' млн ₽',safe(x.benefitKey))}</div><div class="decision-evidence">Основание: <code>${safe(x.evidenceRef)}</code> · Согласований: ${Object.keys(x.approvals).length} · Результат: ${x.outcomeEvidence?'есть акт':'не подтверждён'}</div>${available.length?`<div class="decision-actions"><input data-note="${x.id}" placeholder="Ссылка на протокол, заключение или акт" aria-label="Доказательство для ${x.id}">${available.map(a=>`<button class="smallbtn" data-act="${a}" data-id="${x.id}">${safe(ACTION_LABEL[a])}</button>`).join('')}</div>`:`<div class="form-note">Нет доступных действий для выбранной роли. Требуется следующий участник процесса либо завершена стадия.</div>`}</article>`;
}
function decisions(){const mine=state.initiatives.filter(i=>i.orgId===orgId);const dup=portfolioBenefits(mine);return `<div class="intro"><h2>Инвестиционные решения</h2><p>Документально контролируемый путь: инициатор → инженер → экономист → утверждение → исполнение → независимая проверка результата.</p></div><div class="metrics compact">${metric('Инициативы',mine.length,'Текущая организация')}${metric('Дубли кодов эффекта',dup.duplicateKeys.length,'Один эффект не суммируется повторно')}${metric('Конфликт сумм',dup.conflictingKeys.length,'Исключено из итоговой суммы')}${metric('Утверждённый валовый эффект',fmt(dup.uniqueAnnualBenefitMln)+' млн ₽/год','Сценарная, не фактическая величина')}</div><div class="content-grid"><div class="surface decision-list"><div class="surface-head"><h3>Реестр</h3><span>${mine.length} инициатив</span></div>${mine.length?mine.map(decisionItem).join(''):'<div class="empty-state"><div>◇</div><h3>Нет решений для этой организации</h3><p>Создайте учебную карточку. Смена роли покажет независимые проверки, которые нужны для следующего этапа.</p></div>'}</div>${decisionCreate()}</div>`;}
async function auditView(){const v=await verifyAudit(state.events);const entries=state.events.filter(x=>!x.objectId||state.initiatives.find(i=>i.id===x.objectId)?.orgId===orgId);return `<div class="intro"><h2>Журнал доказательств</h2><p>Цепочка SHA-256 в защищённом браузерном контексте, учебный контрольный хеш в режиме ограниченного предпросмотра.</p></div><div class="audit-banner ${v?'valid':'invalid'}"><strong>${v?'Целостность записей подтверждена':'Обнаружено изменение журнала'}</strong><small>${state.events.length} событий; журнал хранится в браузере, без серверной защиты или доверенной подписи</small></div><div class="surface"><div class="surface-head"><h3>События</h3><span>Только читаемая история</span></div>${entries.length?`<table class="data-table"><thead><tr><th>№ и время</th><th>Действие / объект</th><th>Участник</th><th>Отпечаток</th></tr></thead><tbody>${entries.slice().reverse().map(x=>`<tr><td>${x.seq}<br><small>${safe(x.at)}</small></td><td>${safe(x.action)}<br><small>${safe(x.objectId)}</small></td><td>${safe(x.actor)}</td><td><code>${safe(x.hash.slice(0,15))}…</code></td></tr>`).join('')}</tbody></table>`:'<div class="empty-state"><p>Событий пока нет. Сначала создайте решение.</p></div>'}</div>`;}
function quality(){const tests=[['Математика','NPV; баланс воды; тепловой поток; баланс электросети','Автотесты Node.js'],['Данные','Строгие единицы измерения, отрицательный баланс, отсутствующие сведения','Локальная валидация'],['Решения','Семь стадий, роли, инженерное и финансовое согласование','Модель состояний'],['Эффект','Дубли кодов предотвращают двойной учёт','Портфельный контроль'],['Доказательства','SHA-256 цепочка и проверка изменения','Клиентская демонстрация'],['Границы','Нет SCADA, АСУ ТП, технологических команд и доступа к реальной телеметрии','Явное исключение'],['Не реализовано','Серверная авторизация, БД, криптоподписи, подключение инженерных солверов, BIM/ERP, CI/CD production','Production HOLD']];return `<div class="intro"><h2>Контроль качества</h2><p>Ниже — реальный состав проверяемого лабораторного ПО. Наличие пункта в архитектуре не означает его промышленной реализации.</p></div><div class="surface"><div class="surface-head"><h3>Проверяемые механизмы</h3><span>Код и тесты в комплекте</span></div><table class="data-table"><thead><tr><th>Раздел</th><th>Что проверяется</th><th>Область проверки</th></tr></thead><tbody>${tests.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join('')}</tbody></table><div class="disclaimer"><b>Статус безопасности:</b> фронтендовый выбор роли не обеспечивает защиты данных. Для реального развёртывания необходимы серверная аутентификация, авторизация, журнал в защищённом хранилище, журналы доступа, угрозмодель и независимый аудит.</div></div>`;}

function assurancePanel(){
  return `<div class="intro"><h2>V6 Assurance Lab</h2><p>Executable quality and scenario proof checks on synthetic data only. No operational commands or live engineering models.</p></div>
  <div class="surface"><div class="surface-head"><h3>Evidence-based gates</h3><span>34 added automated tests</span></div>
  <div class="content-grid"><div class="surface" style="padding:18px"><h3>Forecast time-leakage gate</h3><p>Requires all model features to exist by forecast issue time and observed truth by evaluation time.</p><button class="smallbtn" data-assure="forecast-good">Valid history</button> <button class="smallbtn" data-assure="forecast-bad">Deliberate leakage</button></div>
  <div class="surface" style="padding:18px"><h3>Scenario comparability</h3><p>Same asset, evidence snapshot, model, constraint set and valuation date; hard constraints cannot be overridden by benefit.</p><button class="smallbtn" data-assure="scenario-good">Comparable scenarios</button> <button class="smallbtn" data-assure="scenario-bad">Incomparable baselines</button></div>
  <div class="surface" style="padding:18px"><h3>Capital portfolio gates</h3><p>Mandatory investment, dependencies, mutually exclusive alternatives and annual cash budgets.</p><button class="smallbtn" data-assure="portfolio-good">Valid portfolio</button> <button class="smallbtn" data-assure="portfolio-bad">Missing mandatory project</button></div>
  <div class="surface" style="padding:18px"><h3>Measurement quality</h3><p>Separates absent value from valid zero, rejects wrong units, tenant scope and future observations.</p><button class="smallbtn" data-assure="quality-good">Valid measurement</button> <button class="smallbtn" data-assure="quality-bad">Unit mismatch</button></div></div>
  <div class="surface" style="padding:18px;margin-top:16px"><div class="surface-head"><h3>Gate output</h3><span>Validation response JSON</span></div><pre id="assurance-output" style="white-space:pre-wrap;word-break:break-word;max-height:350px;overflow:auto">Choose one proof test. No live plant data is loaded.</pre></div></div>`;
}
function runAssurance(which){
  const row=(forecastId,predicted,actual)=>({forecastId,issuedAt:'2026-10-01T12:00:00Z',featuresAvailableAt:'2026-10-01T11:00:00Z',targetAt:'2026-10-02T12:00:00Z',observedAvailableAt:'2026-10-03T12:00:00Z',unit:'m3/s',predicted,actual});
  const baseCtx={orgId:'kolymaenergo',assetId:'kolyma',baselineSnapshotId:'DATA-01',constraintSetId:'C-01',modelVersion:'study-v0',valuationDate:'2026-10-20',currency:'RUB',discountRate:0.12};
  const sc=(scenarioId,b)=>({scenarioId,context:{...baseCtx},capexMln:10,cashflowsMln:[b,b,b],constraints:[{id:'hard-rule-01',kind:'hard',passed:true,evidenceRef:'synthetic-protocol'}]});
  const project=(id,mandatory)=>({id,mandatory,dependencies:[],exclusions:[],cashOutByYearMln:{2027:3}});
  const measured={orgId:'magadanenergo',assetId:'grid-demo',metricId:'energy',unit:'MWh',sourceId:'synthetic-meter',observedAt:'2026-10-01T10:00:00Z',value:0,quality:'validated'};
  const data={
    'forecast-good':()=>verifyForecastBacktest([row('F1',11,10),row('F2',18,20)],{asOf:'2026-10-20T12:00:00Z'}),
    'forecast-bad':()=>verifyForecastBacktest([{...row('F1',11,10),featuresAvailableAt:'2026-10-02T12:01:00Z'},row('F2',18,20)],{asOf:'2026-10-20T12:00:00Z'}),
    'scenario-good':()=>compareDecisionScenarios(sc('BASE',7),sc('ALT',9)),
    'scenario-bad':()=>compareDecisionScenarios(sc('BASE',7),{...sc('ALT',9),context:{...baseCtx,baselineSnapshotId:'DATA-02'}}),
    'portfolio-good':()=>checkPortfolio({projects:[project('MAND',true),project('OPTION',false)],selectedIds:['MAND','OPTION'],annualCapsMln:{2027:8}}),
    'portfolio-bad':()=>checkPortfolio({projects:[project('MAND',true),project('OPTION',false)],selectedIds:['OPTION'],annualCapsMln:{2027:8}}),
    'quality-good':()=>validateMeasurementBatch([measured],{orgId:'magadanenergo',assetId:'grid-demo',metricUnits:{energy:'MWh'},asOf:'2026-10-20T12:00:00Z'}),
    'quality-bad':()=>validateMeasurementBatch([{...measured,unit:'kWh'}],{orgId:'magadanenergo',assetId:'grid-demo',metricUnits:{energy:'MWh'},asOf:'2026-10-20T12:00:00Z'})
  };
  return data[which]();
}

async function render(){nav();$('#org').value=orgId;$('#role').value=role;$('#who').textContent=`${rolesRu[role]} / ${orgId==='kolymaenergo'?'Колымаэнерго':'Магаданэнерго'}`;let view=route==='overview'?overview():MODULES.some(m=>m.id===route)?moduleView(route):route==='decisions'?decisions():route==='audit'?await auditView():route==='assurance'?assurancePanel():quality();$('#main').innerHTML=view;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(b.dataset.open));if($('#open-decisions'))$('#open-decisions').onclick=()=>go('decisions');document.querySelectorAll('[data-assure]').forEach(b=>b.onclick=()=>{try{const value=runAssurance(b.dataset.assure);$('#assurance-output').textContent=JSON.stringify({gate:b.dataset.assure,result:value,scope:'SYNTHETIC_ONLY'},null,2);}catch(e){$('#assurance-output').textContent=JSON.stringify({gate:b.dataset.assure,blocked:true,reason:e.message},null,2);}});if($('#to-decision'))$('#to-decision').onclick=()=>go('decisions');if($('#calculator'))$('#calculator').onsubmit=e=>{e.preventDefault();try{renderResult(route,e.target);toast('Учебный расчёт выполнен');}catch(err){$('#calc-result').textContent=err.message;toast(err.message,true);}};
  if($('#new-decision')){$('#asset-select').onchange=e=>{$('#module-select').innerHTML=moduleOptions(e.target.value).map(m=>`<option value="${m.id}">${m.name}</option>`).join('');};$('#new-decision').onsubmit=async e=>{e.preventDefault();try{const raw=Object.fromEntries(new FormData(e.target));const req={...raw,capexMln:Number(raw.capexMln),annualBenefitMln:Number(raw.annualBenefitMln),annualOpexMln:Number(raw.annualOpexMln),discountRate:Number(raw.discountRate),years:Number(raw.years)};const next=createInitiative(state,req,actor());const item=next.initiatives.at(-1);state=await appendAudit(next,{action:'create',actor:actor().userId,objectId:item.id,note:'Лабораторная карточка'});persist();render();toast('Инициатива создана, требуется инженерная проверка');}catch(err){toast(err.message,true);}};}
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const note=document.querySelector(`[data-note="${b.dataset.id}"]`)?.value||'';try{let next=transitionDecision(state,b.dataset.id,b.dataset.act,actor(),note);state=await appendAudit(next,{action:b.dataset.act,actor:actor().userId,objectId:b.dataset.id,note:note||'Лабораторный переход'});persist();render();toast('Этап изменён; запись добавлена в журнал');}catch(err){toast(err.message,true);}});
}
window.addEventListener('hashchange',()=>{let v=location.hash.replace('#','');if(v&&v!==route){route=v;render();}});
load();route=location.hash.slice(1)||'overview';if(!['overview','decisions','audit','assurance','quality',...MODULES.map(m=>m.id)].includes(route))route='overview';setupShell();await refreshIntegrity();await render();
})().catch(e=>console.error(e));
</script></body></html>
