name: HydroKontur V8.7 Unified Synthetic Staging PG17 + OIDC + Chromium + Recovery (NOT corporate)

on:
  pull_request:
    paths:
      - '.github/workflows/v87-unified-staging.yml'
      - 'scripts/bootstrap_native.py'
      - 'scripts/v87_backup_restore.py'
      - 'server/hydro_api/**'
      - 'server/migrations/**'
      - 'server/ui/**'
      - 'server/tests_v87/**'
      - 'server/tests_v88/**'
      - 'server/tests_v71/test_postgres_native.py'
      - 'server/tests_v78/test_postgres_native_v78.py'
      - 'server/tests_v8/test_postgres_native_boundary_v8.py'
      - 'server/tests_v81/test_pg_graph_freeze_native_v81.py'
      - 'server/requirements-browser.txt'
      - 'server/requirements-v71.txt'
      - 'scripts/v84_junit_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v87-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  unified-pg17-oidc-chromium-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hydrokontur_v72_acceptance_v87
          POSTGRES_PASSWORD: v87-ephemeral-only-never-real-password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      HYDRO_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HYDRO_NATIVE_CONFIG: /tmp/v87-native.json
      HYDRO_NATIVE_TESTS_REQUIRED: '1'
      HYDRO_BROWSER_EVIDENCE_DIR: /tmp/v87-browser-proof
      HYDRO_PG_ADMIN_URL: postgresql://postgres:v87-ephemeral-only-never-real-password@127.0.0.1:5432/hydrokontur_v72_acceptance_v87
      PYTHONPATH: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify pinned SHA and no protected environment inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HYDRO_EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test -z "${HYDRO_ALLOW_DEMO_SEED:-}"
          test -z "${HYDRO_PRODUCTION_DATABASE_URL:-}"
          echo "V87_SOURCE_PINNED=$HYDRO_EXPECTED_SHA"
          echo "V87_SCOPE=SYNTHETIC_OIDC_PROVIDER_NO_REAL_MFA_OR_CORPORATE_IDP"
      - name: Install complete declared PG17 and browser test dependencies
        run: |
          python -m pip install -r server/requirements-v71.txt
          python -m pip install -r server/requirements-browser.txt
      - name: Install and run genuine Chromium
        run: python -m playwright install --with-deps chromium
      - name: Bootstrap fresh isolated PostgreSQL17 with FORCE RLS and separate credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HYDRO_EXPECTED_SHA"
          python scripts/bootstrap_native.py --out "$HYDRO_NATIVE_CONFIG"
          chmod 600 "$HYDRO_NATIVE_CONFIG"
          echo "V87_PG17_ISOLATED_MIGRATIONS_APPLIED"
      - name: Real HTTP synthetic OIDC + actual PG17 + six independent Chromium sessions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 900s \
            python -m pytest -q -ra -o xfail_strict=true --maxfail=1 \
            server/tests_v87/test_pg_oidc_browser_unified_v87.py --junitxml=/tmp/v87-unified.xml
          python scripts/v84_junit_gate.py \
            --junit /tmp/v87-unified.xml --shard v87-unified-pg17-oidc-chromium \
            --min-passed 2 --max-skipped 0 \
            --actual-sha "$HYDRO_EXPECTED_SHA" --expected-sha "$HYDRO_EXPECTED_SHA" \
            --require-case test_v87_real_pg17_oidc_http_chromium_roles_and_audit \
            --require-case test_v87_mfa_claim_policy_enforced_and_no_auto_provision
          sha256sum /tmp/v87-unified.xml
      - name: Recheck native PostgreSQL17 RLS tenant rollback and concurrency on same database
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 900s \
            python -m pytest -q -ra -o xfail_strict=true --maxfail=1 \
            server/tests_v71/test_postgres_native.py \
            server/tests_v78/test_postgres_native_v78.py \
            server/tests_v8/test_postgres_native_boundary_v8.py \
            server/tests_v81/test_pg_graph_freeze_native_v81.py \
            --junitxml=/tmp/v87-native.xml
          python scripts/v84_junit_gate.py \
            --junit /tmp/v87-native.xml --shard v87-shared-native-pg17 \
            --min-passed 40 --max-skipped 0 \
            --actual-sha "$HYDRO_EXPECTED_SHA" --expected-sha "$HYDRO_EXPECTED_SHA" \
            --require-case test_native_installed_version_and_exact_lock_contract
          sha256sum /tmp/v87-native.xml
      - name: Real PG17 logical backup restore and RLS policy parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v87_backup_restore.py \
            --native-config "$HYDRO_NATIVE_CONFIG" --output /tmp/v87-recovery/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/v87-recovery/receipt.json').read_text())
          assert x['table_count']>=30 and x['rls_policy_count']>=80
          assert x['table_rows_equal'] and x['rls_policies_equal'] and x['triggers_equal']
          assert x['restored_rls_without_session_default_deny'] is True
          assert x['production_ready'] is False
          print('V87_RECOVERY_SMOKE_PASS',x['table_count'],x['total_rows'],x['rls_policy_count'],x['trigger_count'])
          PY
          sha256sum /tmp/v87-recovery/receipt.json
      - name: Explicit fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HYDRO_EXPECTED_SHA"
          test -s /tmp/v87-unified.xml
          test -s /tmp/v87-native.xml
          test -s /tmp/v87-recovery/receipt.json
          test -z "$(git status --porcelain)"
          echo "V87_UNIFIED_SYNTHETIC_GATES_GREEN"
          echo "Corporate IdP/MFA enrollment, TLS ingress, WORM external compliance, real hydraulic data and production remain HOLD."
      - name: Delete all synthetic credentials
        if: always()
        run: rm -f /tmp/v87-native.json
