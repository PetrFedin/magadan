name: HydroKontur V9.12 Causal Multi-Period Cascade Physics (SYNTHETIC ONLY)

on:
  push:
    branches:
      - 'research/v912-causal-physical-cascade-20261122'
    paths:
      - '.github/workflows/v912-causal-cascade.yml'
      - 'server/hydro_api/causal_cascade_v912.py'
      - 'server/tests_v9/**'
      - 'scripts/magadan_causal_cascade_v912.py'
      - 'artifacts_v9/magadan_causal_cascade_v912.json'
      - 'docs/V912_CAUSAL_CASCADE_RESEARCH_RU.md'
  pull_request:
    paths:
      - '.github/workflows/v912-causal-cascade.yml'
      - 'server/hydro_api/causal_cascade_v912.py'
      - 'server/tests_v9/**'
      - 'scripts/magadan_causal_cascade_v912.py'
      - 'artifacts_v9/magadan_causal_cascade_v912.json'
      - 'docs/V912_CAUSAL_CASCADE_RESEARCH_RU.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-period-physics-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: server
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install QA dependencies
        run: python -m pip install -r server/requirements-v71.txt
      - name: Full V9 regression and explicit non-admission gates
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            python -m pytest -q -ra -o xfail_strict=true --maxfail=1 \
            server/tests_v9 --junitxml=/tmp/v912-junit.xml
          python scripts/v84_junit_gate.py \
            --junit /tmp/v912-junit.xml \
            --shard v912-causal-multiperiod-synthetic \
            --min-passed 398 --max-skipped 0 \
            --actual-sha "$SOURCE_SHA" --expected-sha "$SOURCE_SHA" \
            --require-case test_baseline_is_algebraically_consistent_synthetic_only \
            --require-case test_delayed_arrival_has_no_same_step_future_water \
            --require-case test_persistent_pipeline_is_counted_in_whole_cascade_mass \
            --require-case test_even_zero_demand_deficit_cannot_hide_cold_bypass \
            --require-case test_unknown_real_curve_and_unverified_dispatch_fail_closed \
            --require-case test_explicit_hydro_energy_sinking_missing_is_infeasible \
            --require-case test_energy_accounting_closes_each_period \
            --require-case test_no_real_dispatch_claim_even_if_synthetic_no_shortfall \
            --require-case test_committed_v912_receipt_matches_exact_input_files \
            --require-case test_independent_first_step_head_oracle \
            --require-case test_independent_first_step_power_oracle_in_gwh \
            --require-case test_bypass_water_is_delayed_even_when_no_hydro_generated_from_it
          sha256sum /tmp/v912-junit.xml
      - name: Historical V9.8 to V9.11 numerical receipts unchanged
        shell: bash
        run: |
          set -euo pipefail
          python scripts/magadan_winter_energy_balance_v97.py
          python scripts/magadan_dispatch_policy_v99.py
          python scripts/magadan_terminal_reserve_stress_v910.py
          python scripts/magadan_normative_screen_v911.py
          git diff --exit-code -- artifacts_v9/magadan_winter_energy_balance_v97.json
          git diff --exit-code -- artifacts_v9/magadan_dispatch_policy_v99.json
          git diff --exit-code -- artifacts_v9/magadan_terminal_reserve_stress_v910.json
          git diff --exit-code -- artifacts_v9/magadan_normative_screen_v911.json
          echo "V912_ALL_FOUR_PARENT_RESEARCH_RECEIPTS_UNCHANGED"
      - name: Execute eight synthetic causal test scenarios twice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/magadan_causal_cascade_v912.py
          cp artifacts_v9/magadan_causal_cascade_v912.json /tmp/v912-first.json
          python scripts/magadan_causal_cascade_v912.py
          cmp /tmp/v912-first.json artifacts_v9/magadan_causal_cascade_v912.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("artifacts_v9/magadan_causal_cascade_v912.json")
          a=json.loads(p.read_text(encoding="utf-8"))
          assert a["experiment_count"] == 8
          assert a["summary"]["synthetic_consistent_cases"] == 3
          assert a["summary"]["infeasible_cases"] == 3
          assert a["summary"]["insufficient_evidence_cases"] == 2
          assert a["summary"]["calculated_shortfall_cases"] == 1
          assert a["firm_capacity_mw"] is None
          assert a["production_ready"] is False
          print("V912_REGENERATED_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Evidence handoff if report not yet committed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch artifacts_v9/magadan_causal_cascade_v912.json >/dev/null 2>&1 && \
             git diff --quiet -- artifacts_v9/magadan_causal_cascade_v912.json; then
            echo "V912_REPORT_ALREADY_SYNCED"
          else
            python - <<'PY'
          from pathlib import Path
          import base64
          b64=base64.b64encode(Path("artifacts_v9/magadan_causal_cascade_v912.json").read_bytes()).decode("ascii")
          print("V912_REPORT_BASE64_BEGIN")
          for i in range(0,len(b64),2000):
              print("V912_REPORT_CHUNK="+b64[i:i+2000])
          print("V912_REPORT_BASE64_END")
          PY
          fi
      - name: Confirm strict synthetic-only output and no source drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only -- server/ scripts/ data/ docs/)"
          git ls-files --error-unmatch artifacts_v9/magadan_causal_cascade_v912.json
          git diff --exit-code -- artifacts_v9/magadan_causal_cascade_v912.json
          echo "V912_SYNTHETIC_CAUSAL_MASS_ENERGY_ONLY; PHYSICAL_FIELD_STAGING_N1_WATER_RULES_PRODUCTION_HOLD"
