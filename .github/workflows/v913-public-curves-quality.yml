name: HydroKontur V9.13 Public Statutory Curve Data QA (CANDIDATE ONLY)

on:
  push:
    branches:
      - research/v913-public-curves-quality-20261122
    paths:
      - .github/workflows/v913-public-curves-quality.yml
      - server/hydro_api/public_curves_quality_v913.py
      - server/tests_v9/**
      - data/reference/order174_v913_**
      - scripts/magadan_public_curves_quality_v913.py
      - artifacts_v9/magadan_public_curves_quality_v913.json
      - docs/V913_PUBLIC_CURVE_TRANSCRIPTION_QA_RU.md
  pull_request:
    paths:
      - .github/workflows/v913-public-curves-quality.yml
      - server/hydro_api/public_curves_quality_v913.py
      - server/tests_v9/**
      - data/reference/order174_v913_**
      - scripts/magadan_public_curves_quality_v913.py
      - artifacts_v9/magadan_public_curves_quality_v913.json
      - docs/V913_PUBLIC_CURVE_TRANSCRIPTION_QA_RU.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-public-candidate-data-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: server
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check pinned source and initially clean repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install pinned scientific testing dependencies
        run: python -m pip install -r server/requirements-v71.txt
      - name: Generate fresh candidate-only data quality receipt before tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/magadan_public_curves_quality_v913.py
      - name: Entire scientific V9 test suite plus independent tamper checks
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s \
            python -m pytest server/tests_v9 -q -ra -o xfail_strict=true \
            --maxfail=1 --junitxml=/tmp/v913-junit.xml
          python scripts/v84_junit_gate.py \
            --junit /tmp/v913-junit.xml \
            --shard v913-full-statutory-secondary-curve-QA \
            --min-passed 431 --max-skipped 0 \
            --actual-sha "$SOURCE_SHA" --expected-sha "$SOURCE_SHA" \
            --require-case test_full_kolyma_vertical_datum_offset_is_0p94m \
            --require-case test_lower_stage_rounded_flat_volume_does_not_allow_unique_inverse \
            --require-case test_field_mode_always_refuses_candidate_curve_before_interpolation \
            --require-case test_bad_second_tailwater_series_cannot_be_auto_smoothed_in_qa \
            --require-case test_real_physics_engine_is_not_modified_to_use_public_candidates \
            --require-case test_committed_v913_data_quality_receipt_matches_input_bytes \
            --require-case test_second_public_publisher_matches_1521_cells_with_explicit_281_gap \
            --require-case test_publication_cannot_launder_partial_review_into_complete_validation
          sha256sum /tmp/v913-junit.xml
      - name: Reproduce five older independent scientific artifacts bitwise
        shell: bash
        run: |
          set -euo pipefail
          python scripts/magadan_winter_energy_balance_v97.py
          python scripts/magadan_dispatch_policy_v99.py
          python scripts/magadan_terminal_reserve_stress_v910.py
          python scripts/magadan_normative_screen_v911.py
          python scripts/magadan_causal_cascade_v912.py
          git diff --exit-code -- artifacts_v9/magadan_winter_energy_balance_v97.json
          git diff --exit-code -- artifacts_v9/magadan_dispatch_policy_v99.json
          git diff --exit-code -- artifacts_v9/magadan_terminal_reserve_stress_v910.json
          git diff --exit-code -- artifacts_v9/magadan_normative_screen_v911.json
          git diff --exit-code -- artifacts_v9/magadan_causal_cascade_v912.json
          echo "V913_ALL_FIVE_PREVIOUS_SCIENTIFIC_RECEIPTS_REPRODUCED"
      - name: Repeat complete V9.13 quality audit and require reproducibility
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts_v9/magadan_public_curves_quality_v913.json /tmp/v913-one.json
          python scripts/magadan_public_curves_quality_v913.py
          cmp /tmp/v913-one.json artifacts_v9/magadan_public_curves_quality_v913.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("artifacts_v9/magadan_public_curves_quality_v913.json")
          a=json.loads(p.read_text(encoding="utf-8"))
          assert a["summary"]["total_volume_coordinates"]==1802
          assert a["summary"]["candidate_kolyma_coordinates"]==1101
          assert a["summary"]["candidate_ust_coordinates"]==701
          assert a["summary"]["lower_equal_adjacent_rounded_volumes"]==73
          assert a["summary"]["statutory_anchor_points_agree"]==6
          assert a["summary"]["quarantined_secondary_tables"]==4
          assert a["summary"]["registered_tailwater_declines"]==1
          assert a["summary"]["second_publisher_matching_coordinates"]==1521
          assert a["summary"]["second_publisher_unchecked_coordinates"]==281
          assert a["independent_secondary_publisher_comparison"]["original_official_document_authenticated"] is False
          assert a["firm_available_capacity_mw"] is None
          assert a["complete_independent_second_publisher_cell_comparison"] is False
          assert a["production_ready"] is False
          print("V913_REPORT_FULL_FILE_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish immutable report for human-reviewed repository persistence
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch artifacts_v9/magadan_public_curves_quality_v913.json >/dev/null 2>&1 && \
            git diff --quiet -- artifacts_v9/magadan_public_curves_quality_v913.json; then
            echo "V913_REPORT_COMMITTED_AND_EXACTLY_REPRODUCED"
          else
            python - <<'PY'
          from pathlib import Path
          from base64 import b64encode
          b64=b64encode(Path("artifacts_v9/magadan_public_curves_quality_v913.json").read_bytes()).decode()
          print("V913_REPORT_BASE64_BEGIN")
          for i in range(0,len(b64),2000):
              print("V913_REPORT_CHUNK="+b64[i:i+2000])
          print("V913_REPORT_BASE64_END")
          PY
          fi
      - name: No hidden production promotion or source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only -- server/ scripts/ data/ docs/)"
          git ls-files --error-unmatch artifacts_v9/magadan_public_curves_quality_v913.json
          git diff --exit-code -- artifacts_v9/magadan_public_curves_quality_v913.json
          echo "V913_SECONDARY_PUBLIC_CANDIDATES_ONLY; REAL_HYDRAULIC_ADMISSION_QUARANTINED; PRODUCTION_HOLD"
