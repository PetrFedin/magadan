name: V8.2 Synthetic HydroForecast Regression

on:
  pull_request:
    paths:
      - 'server/hydro_api/forecast_v82.py'
      - 'server/hydro_api/forecast_api_v82.py'
      - 'server/tests_v82/**'
      - 'server/hydro_api/main.py'
      - 'server/ui/**'
      - '.github/workflows/native-v82.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install from declared API requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
      - name: Verify synthetic forecasting and API authorization
        run: |
          PYTHONPATH=server python -m pytest -q server/tests_v82
          node --check server/ui/ui.js
      - name: JavaScript numerical regression
        run: |
          cd v6-client
          npm test
      - name: Explicit scope
        run: |
          echo 'Synthetic forecast tool tests only. Native PostgreSQL 17, external hydrology, approved data and industrial E2E are separate HOLD gates.'
