# Minimal runner admission probe. Does NOT validate HydroKontur application.
name: Magadan Runner Allocation Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-probe:
    name: Runner allocation only - no dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove a runner started
        run: |
          echo "RUNNER_ASSIGNED"
          printf 'os=%s\n' "$RUNNER_OS"
          printf 'repository=%s\n' "$GITHUB_REPOSITORY"
