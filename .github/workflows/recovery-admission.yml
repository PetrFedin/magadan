name: Magadan V7.9 Recovery Admission

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magadan-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-tool-tests:
    name: Recovery tool / offline fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and test recovery tool
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
      - name: Explicit scope disclaimer
        run: |
          echo 'This job tests the recovery tooling on synthetic fixtures only.'
          echo 'A green result does not prove that HydroKontur app sources were imported.'

  source-tree-admission:
    name: Import provenance admission (EXTERNAL ATTESTATION REQUIRED)
    needs: [recovery-tool-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require original source tree, manifest and independent SHA-256
        env:
          HYDRO_TRUSTED_SOURCE_ARCHIVE_SHA256: ${{ vars.HYDRO_TRUSTED_SOURCE_ARCHIVE_SHA256 }}
          HYDRO_TRUSTED_SOURCE_MANIFEST_SHA256: ${{ vars.HYDRO_TRUSTED_SOURCE_MANIFEST_SHA256 }}
          HYDRO_SOURCE_RELEASE: ${{ vars.HYDRO_SOURCE_RELEASE }}
        run: |
          if [ -z "$HYDRO_TRUSTED_SOURCE_ARCHIVE_SHA256" ] || [ -z "$HYDRO_TRUSTED_SOURCE_MANIFEST_SHA256" ]; then
            echo '::error::Original archive AND source manifest require separately reviewed SHA-256 pins.'
            echo 'Never claim provenance based only on self-declared manifest or archive hash.'
            exit 2
          fi
          # Historical source is fixed at its import SHA. Later documented code
          # edits on this PR must NOT mutate the original source manifest.
          RELEASE="${HYDRO_SOURCE_RELEASE:-v8.0}"
          if [ "$RELEASE" != "v8.0" ]; then
            echo '::error::This integration PR contains the V8.0 original import.'
            exit 2
          fi
          BASELINE="eab0d0b1e418558914a448a21cf496982ac10a1d"
          git merge-base --is-ancestor "$BASELINE" HEAD
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          git archive "$BASELINE" | tar -xf - -C "$STAGE"
          python -m tools.check_source_admission --root "$STAGE" \
            --expected-release "$RELEASE" \
            --require-external-pin \
            --trusted-archive-sha256 "$HYDRO_TRUSTED_SOURCE_ARCHIVE_SHA256" \
            --require-manifest-pin \
            --trusted-manifest-sha256 "$HYDRO_TRUSTED_SOURCE_MANIFEST_SHA256"

  application-regression:
    name: Actual HydroKontur Python/JS regression (after source admission)
    needs: [source-tree-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python application (synthetic lab only)
        env:
          HYDRO_SOURCE_RELEASE: ${{ vars.HYDRO_SOURCE_RELEASE }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          groups=(server/tests server/tests_v71 server/tests_v72 server/tests_v73 server/tests_v74
            server/tests_v75 server/tests_v76 server/tests_v77 server/tests_v78 server/tests_v79)
          if [ "${HYDRO_SOURCE_RELEASE:-v7.9}" = 'v8.0' ]; then
            groups+=(server/tests_v8)
          fi
          PYTHONPATH=server python -m pytest -q "${groups[@]}" -m 'not native_pg' \
            --ignore=server/tests/test_browser.py \
            --ignore=server/tests_v71/test_postgres_native.py \
            --ignore=server/tests_v78/test_postgres_native_v78.py
      - name: Test JavaScript application
        working-directory: v6-client
        run: |
          npm ci
          npm test
      - name: This is NOT native/security/industrial acceptance
        run: |
          echo 'PostgreSQL 17 native RLS / corporate MFA / external WORM / field engineering are separate mandatory gates.'
